:root {
  /* Layout: the result sits on a blue enamel house-number plate; everything else is ink on
     enamel white, left aligned, in a form column and a results column. */
  --bg: #f1f3f8;
  --surface: #ffffff;
  --sunken: #e8ecf4;
  --ink: #111a30;
  --ink-2: #434d68;
  --muted: #68718e;
  --line: #d8dde9;
  --line-2: #bcc4d6;
  --enamel: #1f3d99;
  --enamel-tint: #e3e9fa;
  --frame: #1b6a4b;
  --focus: #1f3d99;
  --good: #0b7a2a;
  --warn: #855600;
  --bad: #b3261e;
  --good-bg: #e3f4e6;
  --warn-bg: #fff1cf;
  --bad-bg: #fde4e1;
  --info-bg: #e9edf7;
  --s-bank: #2a78d6;
  --s-ptz: #eb6834;
  --s-al: #1baf7a;
  --s-other: #eda100;
  --s-ins: #e87ba4;
  --s-own: #8d96ad;
  --grid: #e3e7f0;
  --axis: #bcc4d6;
  --font-display: "Barlow Semi Condensed", "DIN Alternate", "Bahnschrift", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1430; --surface: #162042; --sunken: #101a3a;
    --ink: #eef1fb; --ink-2: #bcc4dc; --muted: #8f99b6;
    --line: #2a3765; --line-2: #3f4d80;
    --enamel: #2b4dc0; --enamel-tint: #233270; --frame: #2f9a6f; --focus: #9db5ff;
    --good: #5bd17a; --warn: #f5c04a; --bad: #ff9a90;
    --good-bg: #12351f; --warn-bg: #3a2c0b; --bad-bg: #431b18; --info-bg: #1c2853;
    --s-bank: #3987e5; --s-ptz: #d95926; --s-al: #199e70; --s-other: #c98500; --s-ins: #d55181; --s-own: #7f89a8;
    --grid: #243160; --axis: #3f4d80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1430; --surface: #162042; --sunken: #101a3a;
  --ink: #eef1fb; --ink-2: #bcc4dc; --muted: #8f99b6;
  --line: #2a3765; --line-2: #3f4d80;
  --enamel: #2b4dc0; --enamel-tint: #233270; --frame: #2f9a6f; --focus: #9db5ff;
  --good: #5bd17a; --warn: #f5c04a; --bad: #ff9a90;
  --good-bg: #12351f; --warn-bg: #3a2c0b; --bad-bg: #431b18; --info-bg: #1c2853;
  --s-bank: #3987e5; --s-ptz: #d95926; --s-al: #199e70; --s-other: #c98500; --s-ins: #d55181; --s-own: #7f89a8;
  --grid: #243160; --axis: #3f4d80;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 var(--font-body);
}
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--focus); text-underline-offset: 2px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: min(100% - 2.5rem, 72.5rem); margin-inline: auto; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header and tabs ---------- */
.top { padding-top: 1.75rem; }
.top-in { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: flex-start; justify-content: space-between; }
.brand h1 { font: 600 1.875rem/1.1 var(--font-display); letter-spacing: 0.005em; text-wrap: balance; }
.brand p { margin-top: 0.4rem; color: var(--ink-2); max-width: 58ch; }
.tools { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 0.4rem; min-height: 2.5rem; padding: 0 0.9rem;
  border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--ink);
  font-size: 0.9375rem;
}
.btn:hover { border-color: var(--ink-2); }
.btn--primary { background: var(--enamel); border-color: var(--enamel); color: #fff; font-weight: 600; }
.btn--quiet { background: transparent; }
.btn svg { flex: none; }
.langs { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.langs button { border: 0; background: none; min-width: 2.75rem; min-height: 2.5rem; font-weight: 600; font-size: 0.9375rem; color: var(--ink-2); }
.langs button[aria-pressed="true"] { background: var(--enamel); color: #fff; }
.tabs { display: flex; gap: 0.25rem 1.75rem; margin-top: 1.5rem; border-bottom: 1px solid var(--line-2); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  border: 0; background: none; padding: 0.6rem 0 0.7rem; white-space: nowrap;
  font: 600 1.125rem/1.2 var(--font-display); color: var(--ink-2);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--enamel); }
main { padding: 1.75rem 0 6rem; }
.panel-tab > * + * { margin-top: 2rem; }

/* ---------- hero: the plate and the summary ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 2rem 2.5rem; align-items: start; }
.hero-left { display: grid; gap: 1rem; }
.plaque {
  position: relative; background: var(--enamel); color: #fff; border-radius: 18px;
  border: 5px solid var(--frame); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.92);
  padding: 1.6rem 2.6rem 1.7rem;
}
.plaque::before, .plaque::after {
  content: ""; position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.78); box-shadow: inset 0 0 0 2.5px rgba(10, 22, 70, 0.45);
}
.plaque::before { left: 0.85rem; }
.plaque::after { right: 0.85rem; }
.plaque-label { font-size: 1rem; opacity: 0.92; }
.plaque-num { font: 700 clamp(2.9rem, 6.2vw, 4.4rem)/1 var(--font-display); letter-spacing: 0.01em; margin-top: 0.35rem; white-space: nowrap; }
.plaque-sub { margin-top: 0.5rem; font-size: 0.9375rem; opacity: 0.92; min-height: 1.4em; }
.mode { display: grid; gap: 0.75rem; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem 1.5rem; }
.kpi-label { font-size: 0.9375rem; color: var(--ink-2); }
.kpi-val { font: 600 1.875rem/1.15 var(--font-display); margin-top: 0.1rem; white-space: nowrap; }
.kpi-val.is-bad { color: var(--bad); }
.kpi-note { font-size: 0.8125rem; color: var(--muted); margin-top: 0.15rem; }

        { deferral: 10, repay: 15 },
        { deferral: 8, repay: 12 },
        { deferral: 2, repay: 13 },
        { deferral: 0, repay: 10 }
      ],
      minWorksShare: 25,
      minDeferral: 2
    },
    al: {
      max: 30000,
      rate: 1,
      maxYears: 25,
      maxShare: 0.4,
      // 2026 income ceilings (vs reference tax income of 2024), household of 1 to 6.
      ceilings: {
        Abis: [44344, 66276, 86878, 103727, 123415, 138874],
        A: [44344, 66276, 79666, 95427, 112968, 127122],
        B1: [36144, 48268, 58043, 70073, 82432, 92900],
        B2C: [32530, 43439, 52239, 63066, 74189, 83611]
      },
      extra: { Abis: 15471, A: 14164, B1: 10364, B2C: 9325 }
    },
    hcsf: { maxRatio: 35, maxYears: 25, maxYearsNew: 27 },
    notary: { old: 8, neu: 2.5 },
    otherFees: 2,
    // Usury ceilings (maximum APR, insurance and fees included), fixed-rate loans, Q4 2026.
    usury: { asOf: 'T4 2026', under10: 4.09, under20: 4.68, over20: 5.4 },
    market: { rate25: 3.85, rate20: 3.76, rate15: 3.56, irl: 1.57 }
  };

  function zoneKeyPtz(zone) { return zone === 'Abis' ? 'A' : zone; }
  function zoneKeyAl(zone) { return zone === 'Abis' || zone === 'A' || zone === 'B1' ? zone : 'B2C'; }

  /* ---------- PTZ: eligibility and maximum amount for a given cost ---------- */
  function ptzRules(inp, cost) {

    if (income > res.incomeCeiling) res.reasons.push(res.floorApplied ? 'incomeFloor' : 'income');
    var q = income / R.coef[Math.min(n, 8) - 1];

    for (var i = 0; i < 4; i++) { if (q <= R.trancheMax[z][i]) { tr = i; break; } }
    res.tranche = tr + 1;
    res.quotite = (inp.isNew && inp.isHouse) ? R.quotite.newHouse[tr] : R.quotite.general[tr];
    res.costCeiling = R.costCeiling[z][Math.min(n, 5) - 1];
    res.base = Math.min(cost, res.costCeiling);
    res.deferralYears = R.terms[tr].deferral;
    res.repayYears = R.terms[tr].repay;
    res.eligible = res.reasons.length === 0;
    res.maxAmount = res.eligible ? res.quotite * res.base : 0;
    return res;
  }

  /* ---------- Action Logement "pret accession" ---------- */
  function alRules(inp, totalCost) {
    var R = RULES.al;
    var res = { eligible: false, reasons: [] };
    if (!inp.privateEmployee) res.reasons.push('employee');
    if (!inp.firstTime) res.reasons.push('firstTime');
    if (!inp.isNew) res.reasons.push('oldHome');
    var zk = zoneKeyAl(inp.zone);
    var n = Math.max(1, Math.round(inp.persons || 1));
    res.incomeCeiling = n <= 6 ? R.ceilings[zk][n - 1] : R.ceilings[zk][5] + (n - 6) * R.extra[zk];

  /* ---------- A plain loan. During a deferral only interest is paid. ---------- */
  function loanSchedule(amount, ratePct, months, deferMonths) {
    var r = ratePct / 1200, pay = [], interest = [], bal = [];
    months = Math.max(1, Math.round(months));
    deferMonths = Math.max(0, Math.min(Math.round(deferMonths || 0), months - 1));
    var n = months - deferMonths, b = amount;
    var pmt = r > 0 ? b * r / (1 - Math.pow(1 + r, -n)) : b / n;

  /* ---------- Bank loan with stepped payments ("lissage") ----------

  function smoothBank(L, ratePct, n, othersByMonth, bankIns) {
    var r = ratePct / 1200, t;

    if (!(L > 0)) return out;
    function pv(M) {
      var s = 0, v = 1;
      for (var k = 0; k < n; k++) {
        v /= (1 + r);

    var lo = 0, hi = L * (r + 1 / n) * 2 + bankIns + 1;
    for (t = 0; t < n; t++) hi = Math.max(hi, (othersByMonth[t] || 0) + bankIns + 1);

    while (pv(hi) < L && guard++ < 200) hi *= 2;

  /* ---------- Annual percentage rate of the bank loan (actuarial) ---------- */
  function aprOf(netReceived, flows) {
    if (!(netReceived > 0) || !flows.length) return null;

    for (var k = 0; k < flows.length; k++) sum += flows[k];
    if (sum <= netReceived) return 0;
    function pv(i) { var s = 0, v = 1; for (var k = 0; k < flows.length; k++) { v /= (1 + i); s += flows[k] * v; } return s; }

  /* ---------- Full financing plan for a given price ---------- */
  function plan(inp, price, opts) {
    opts = opts || {};

    var worksShare = (!inp.isNew && inp.withWorks) ? Math.min(90, Math.max(0, inp.worksShare || 0)) / 100 : 0;
    var notary = price * (1 - worksShare) * (inp.notaryPct || 0) / 100;
    var other = price * (inp.otherFeesPct || 0) / 100;
    var needs = price + notary + other;
    var apportAvail = opts.apport != null ? Math.max(0, opts.apport) : Math.max(0, (inp.savings || 0) - (inp.reserve || 0));
    var apport = Math.min(apportAvail, needs);
    var N = needs - apport;
    var insRate = (inp.insurance || 0) / 1200;
    var bankMonths = Math.max(12, Math.round((inp.years || 25) * 12));

      al.amount = Math.min(Math.max(0, inp.alAmount || 0), remaining);
      al.rate = Math.max(0, inp.alRate || 0);

        else if (l.id === 'al') { row.al = p; row.alInt = it; row.alBal = bl; interestBy.al += it; }

      row.interest = row.bankInt + row.alInt + row.otherInt;

    if (bankAmount > 0) loans.push({ id: 'bank', amount: bankAmount, rate: inp.rate || 0, months: bankMonths, defer: 0 });

  function capacity(inp) {

  /* ---------- Highest price whose payments fit the monthly capacity ---------- */

  /* ---------- Buy now, rent then buy, or keep renting ---------- */
  function compare(inp, planA) {

    var P = planA.price;
    var budget0 = (inp.rent || 0) + (inp.monthlySavings || 0);
    var S = Math.max(0, inp.savings || 0);
    function yr(t) { return Math.floor(t / 12); }
    function budget(t) { return budget0 * Math.pow(1 + infl, yr(t)); }
    function rent(t) { return (inp.rent || 0) * Math.pow(1 + gR, yr(t)); }
    function extras(t, start) {
      var f = Math.pow(1 + infl, yr(t));

      var tax = exempt ? 0 : (inp.taxeFonciere || 0) / 12 * f;

      return { charges: charges, tax: tax, upkeep: upkeep, sum: charges + tax + upkeep };

      if (t === 0) {
        firstYearOwn = { loan: row ? row.total : 0, charges: ex.charges, tax: ex.tax, upkeep: ex.upkeep, total: cost };
        if (cost > budget(0)) shortfallA = cost - budget(0);

      liqA = liqA * (1 + rm) + budget(t) - cost;

        var priceThen = value(t);

        planB = plan(inp, priceThen, { apport: apportThen, noPtz: !inp.ptzLater });

          ratio: incomeThen > 0 ? (planB.maxPayment + (inp.existingLoans || 0)) / incomeThen * 100 : 0 };

        liqB = liqB * (1 + rm) + budget(t) - rent(t);
      } else {
        var rb = (t - buyMonth) < planB.rows.length ? planB.rows[t - buyMonth] : null;
        liqB = liqB * (1 + rm) + budget(t) - ((rb ? rb.total : 0) + extras(t, buyMonth).sum);
      }
      if ((t + 1) % 12 === 0) {
        var v = value(t + 1) * (1 - resale);
        A.push(v - (row ? row.balance : 0) + liqA);
        C.push(liqC);
        if (buyMonth < 0) B.push(liqB);
        else {
          var rb2 = (t - buyMonth) < planB.rows.length ? planB.rows[t - buyMonth] : null;

    for (var y = 0; y <= H; y++) defl.push(inp.realEuros ? Math.pow(1 + infl, y) : 1);

      if (ahead) { breakEven = y; break; }

    return {
      horizon: H, buy: A, wait: B, rent: C,
      breakEven: breakEven, buyMonth: buyMonth, later: bStart, planLater: planB,

      '<section><h2 class="section-h" style="margin-bottom:1rem">' + esc(t('c.today')) + '</h2>' + grid(['rent', 'monthlySavings', 'horizon', 'targetSavings', 'ptzLater']) + '</section>' +
      '<section class="stack"><h2 class="section-h" id="cmp-after"></h2><div class="tiles" id="cmp-tiles"></div></section>' +
      '<section class="notes" id="cmp-notes"></section>' +
      '<section class="chart-block"><div class="chart-head"><div><h2 class="h3">' + esc(t('c.chart')) + '</h2><p class="chart-sub" id="cmp-chart-sub"></p></div></div><div class="legend" id="cmp-legend"></div><div class="chart" id="cmp-chart"></div></section>' +
      '<div class="cols"><section><h2 class="section-h" style="margin-bottom:1rem">' + esc(t('c.assume')) + '</h2>' + grid(['inflation', 'rentGrowth', 'priceGrowth', 'savingsReturn', 'resalePct', 'realEuros']) + '<p class="muted" style="margin-top:1.25rem;max-width:64ch">' + esc(t('c.method')) + '</p></section>' +
      '<div class="details"><section class="panel" id="cmp-first"></section><section><h2 class="h3" style="margin-bottom:.6rem">' + esc(t('c.table')) + '</h2><div class="tbl-wrap tall" id="cmp-table"></div></section></div></div>';
  }
  function renderCompare(res) {
    var inp = res.inp, c = E.compare(inp, res.plan), H0 = c.horizon;
    var unit = t(inp.realEuros ? 'c.unitReal' : 'c.unitNominal');
    $('#cmp-after').textContent = t('c.after', { h: H0 }) + ', ' + unit;
    var vals = { buy: c.buy[H0], wait: c.wait[H0], rent: c.rent[H0] };
    var rank = PATHS.filter(function (p) { return !(p.k === 'wait' && c.targetReachedNow); }).slice().sort(function (a, b) { return vals[b.k] - vals[a.k]; });
    var best = rank[0].k;
    var subs = {
      buy: t('c.buySub', { price: eur(res.plan.price) }),
      wait: c.targetReachedNow ? t('c.waitNow') : c.buyMonth < 0 ? t('c.waitNever', { h: H0 }) : t('c.waitSub', { when: span(c.buyMonth), price: eur(Math.round(c.later.price / 100) * 100) }),
      rent: t('c.rentSub', { r: numFlex(inp.savingsReturn, 1) })
    };
    $('#cmp-tiles').innerHTML = PATHS.map(function (p) {
      return '<div class="tile"><p class="tile-name"><i class="key" style="border-color:' + p.color + '"></i>' + esc(t(p.name)) + '</p><p class="tile-val">' + eur(vals[p.k]) + '</p><p class="tile-sub">' + esc(subs[p.k]) + '</p>' +
        (p.k === best ? '<p class="badge">' + ICON.ok + esc(t('c.best')) + '</p>' : '') + '</div>';
    }).join('');
    var notes = '', diff = vals[rank[0].k] - vals[rank[1].k];
    notes += '<p class="verdict">' + esc(Math.abs(diff) < 1 ? t('c.verdictTie', { best: t(rank[0].name), second: t(rank[1].name), h: H0 }) : t('c.verdict', { best: t(rank[0].name), second: t(rank[1].name), h: H0, d: eur(diff) })) + '</p>';
    notes += '<p>' + esc(c.breakEven ? t('c.be', { y: c.breakEven }) : t('c.beNever', { h: H0 })) + '</p>';
    if (c.later && !c.targetReachedNow) {
      notes += '<p>' + esc(t('c.laterDetail', { target: eur(inp.targetSavings), when: span(c.buyMonth), price: eur(Math.round(c.later.price / 100) * 100), a: eur(c.later.apport), b: eur(c.later.borrowed), m: eur(c.later.payment), ratio: num(c.later.ratio, 1) })) + '</p>';
      if (c.later.ratio > inp.maxRatio + 0.05) notes += '<p class="callout">' + ICON.warn + '<span>' + esc(t('c.laterBad', { max: numFlex(inp.maxRatio, 1) })) + '</span></p>';
      var when = new Date(today.getFullYear(), today.getMonth() + c.buyMonth, 1);
      if (inp.ptzLater && c.later.ptz > 0 && when > new Date(R.ptz.endYear, R.ptz.endMonth - 1, 31)) notes += '<p class="callout">' + ICON.warn + '<span>' + esc(t('c.laterPtz')) + '</span></p>';
    }
    if (c.shortfall > 1) notes += '<p class="callout">' + ICON.warn + '<span>' + esc(t('c.shortfall', { x: eur(c.shortfall) })) + '</span></p>';
    $('#cmp-notes').innerHTML = notes;
    $('#cmp-chart-sub').textContent = t('c.chartSub') + ' ' + unit.charAt(0).toUpperCase() + unit.slice(1) + '.';
    drawWorth(c);
    var o = c.firstYearOwn;
    $('#cmp-first').innerHTML = '<h2 class="h3">' + esc(t('c.first')) + '</h2><div class="tbl-wrap" style="border:0;margin-top:.5rem"><table class="tbl"><thead><tr><th scope="col"></th><th scope="col">' + esc(t('c.renting')) + '</th><th scope="col">' + esc(t('c.owning')) + '</th></tr></thead><tbody>' +
      '<tr><th scope="row">' + esc(t('c.housing')) + '</th><td>' + eur(c.rent0) + '</td><td>' + eur(o.total) + '</td></tr>' +
      '<tr><th scope="row">' + esc(t('c.left')) + '</th><td>' + eur(c.budget0 - c.rent0) + '</td><td>' + eur(c.budget0 - o.total) + '</td></tr></tbody></table></div>';
    var paths = PATHS.filter(function (p) { return !(p.k === 'wait' && c.targetReachedNow); });
    var tb = '<table class="tbl"><thead><tr><th scope="col">' + esc(t('c.yearCol')) + '</th>' + paths.map(function (p) { return '<th scope="col"><i class="key" style="border-color:' + p.color + '"></i>' + esc(t(p.name)) + '</th>'; }).join('') + '</tr></thead><tbody>';
    for (var y = 0; y <= H0; y++) tb += '<tr><th scope="row">' + (y ? y : esc(t('c.today0'))) + '</th>' + paths.map(function (p) { return '<td>' + eur(c[p.k][y]) + '</td>'; }).join('') + '</tr>';
    $('#cmp-table').innerHTML = tb + '</tbody></table>';
  }

  /* ---------- rules ---------- */
  function rulesHTML() {
    var P = R.ptz, zones = ['A', 'B1', 'B2', 'C'], zn = function (z) { return z === 'A' ? t('ru.t.zoneA') : z; };
    function ul(keys) { return '<ul class="bul">' + keys.map(function (k) { return '<li>' + esc(t(k)) + '</li>'; }).join('') + '</ul>'; }
    function table(cap, head, rows) {
      return '<p class="cap">' + esc(cap) + '</p><div class="tbl-wrap"><table class="tbl"><thead><tr>' + head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return i ? '<td>' + c + '</td>' : '<th scope="row">' + esc(c) + '</th>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    }
    var people = function (n, last) { return n === last ? t('ru.t.more', { n: n }) : String(n); };
    var income = table(t('ru.t.income'), [t('ru.t.persons')].concat(zones.map(zn)), [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return [people(n, 8)].concat(zones.map(function (z) { return num(P.incomeCeiling[z][n - 1], 0); })); }));
    var brackets = table(t('ru.t.brackets'), [t('ru.t.bracket')].concat(zones.map(zn)), [0, 1, 2, 3].map(function (i) { return [String(i + 1)].concat(zones.map(function (z) { return esc(t('ru.t.upTo')) + ' ' + num(P.trancheMax[z][i], 0); })); }));
    var coef = table(t('ru.t.coef'), [t('ru.t.persons')].concat([1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return people(n, 8); })), [[t('ru.t.coef')].concat(P.coef.map(function (c) { return numFlex(c, 1); }))]);
    var share = table(t('ru.t.share'), [t('ru.t.bracket'), t('ru.t.shareGen'), t('ru.t.shareHouse'), t('ru.t.deferral'), t('ru.t.repay')], [0, 1, 2, 3].map(function (i) {
      return [String(i + 1), pct(P.quotite.general[i] * 100, 0), pct(P.quotite.newHouse[i] * 100, 0), P.terms[i].deferral + ' ' + esc(t('ui.years')), P.terms[i].repay + ' ' + esc(t('ui.years'))];
    }));
    var cost = table(t('ru.t.cost'), [t('ru.t.persons')].concat(zones.map(zn)), [1, 2, 3, 4, 5].map(function (n) { return [people(n, 5)].concat(zones.map(function (z) { return num(P.costCeiling[z][n - 1], 0); })); }));
    var alz = ['Abis', 'A', 'B1', 'B2C'], hh = [t('ru.t.hh1'), t('ru.t.hh2')].concat([1, 2, 3, 4].map(function (n) { return t(n === 1 ? 'ru.t.hhN1' : 'ru.t.hhN', { n: n }); }));
    var alT = table(t('ru.t.alIncome'), [t('ru.t.household'), 'A bis', 'A', 'B1', t('ru.t.b2c')], hh.map(function (h, i) { return [h].concat(alz.map(function (z) { return num(R.al.ceilings[z][i], 0); })); }));
    var src = [
      ['ru.src.anil', 'https://www.anil.org/votre-besoin/acheter/financement/prets-reglementes/ptz/'],
      ['ru.src.sp', 'https://www.service-public.gouv.fr/particuliers/vosdroits/F34966/2_0?lang=fr'],
      ['ru.src.zone', 'https://www.service-public.fr/simulateur/calcul/zonage-abc'],
      ['ru.src.al', 'https://www.actionlogement.fr/le-pret-pour-l-acquisition-dans-l-ancien'],
      ['ru.src.ffb', 'https://www.ffbatiment.fr/gestion-entreprise/devis-publicite-relations-clients/negocier-vendre-conseiller-mes-clients/dossier/aides-action-logement'],
      ['ru.src.hcsf', 'https://selectra.info/finance/actualites/marche/credit-immobilier-endettement-35-derogations'],
      ['ru.src.notaires', 'https://www.notaires.fr/fr/immobilier-fiscalite/financement/les-frais-dacquisition'],
      ['ru.src.tf', 'https://bofip.impots.gouv.fr/node/322566'],
      ['ru.src.usury', 'https://selectra.info/finance/actualites/marche/taux-usure-1er-octobre-pret-immobilier-50-ans'],
      ['ru.src.rates', 'https://www.meilleurtaux.com/taux-immobilier'],
      ['ru.src.ins', 'https://www.magnolia.fr/actualites/assurance-emprunteur/barometre-pouvoir-achat-immobilier-octobre-2026'],
      ['ru.src.irl', 'https://www.insee.fr/fr/statistiques/fichier/version-html/9081853/IR246_IRL_3T2026.pdf']
    ];
    return '<div class="stack"><h2 class="section-h">' + esc(t('ru.title')) + '</h2><p class="lead">' + esc(t('ru.intro')) + '</p></div><div>' +
      '<section class="rule"><h2>' + esc(t('ru.hcsf')) + '</h2>' + ul(['ru.hcsf.1', 'ru.hcsf.2', 'ru.hcsf.3']) + '</section>' +
      '<section class="rule"><h2>' + esc(t('ru.ptz')) + '</h2>' + ul(['ru.ptz.1', 'ru.ptz.2', 'ru.ptz.3', 'ru.ptz.4', 'ru.ptz.5', 'ru.ptz.8', 'ru.ptz.9', 'ru.ptz.10', 'ru.ptz.6', 'ru.ptz.7']) + income + brackets + coef + share + cost + '</section>' +
      '<section class="rule"><h2>' + esc(t('ru.al')) + '</h2>' + ul(['ru.al.1', 'ru.al.2', 'ru.al.3', 'ru.al.4']) + alT + '<p class="muted" style="margin-top:.6rem;max-width:76ch">' + esc(t('ru.t.alNote')) + '</p></section>' +
      '<section class="rule"><h2>' + esc(t('ru.fees')) + '</h2>' + ul(['ru.fees.1', 'ru.fees.2', 'ru.fees.3']) + '</section>' +
      '<section class="rule"><h2>' + esc(t('ru.method')) + '</h2>' + ul(['ru.method.1', 'ru.method.2', 'ru.method.3', 'ru.method.4', 'ru.method.5', 'ru.method.6']) + '</section>' +
      '<section class="rule"><h2>' + esc(t('ru.sources')) + '</h2><ul class="src">' + src.map(function (s) { return '<li><a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(t(s[0])) + '</a></li>'; }).join('') + '</ul></section></div>';
  }

  /* ---------- shell, tabs, events ---------- */
  function renderShell() {
    document.documentElement.lang = lang;
    document.title = t('app.title');
    $('#app-title').textContent = t('app.title');
    $('#app-tagline').textContent = t('app.tagline');
    $('#foot').textContent = t('foot');
    $('#langs').setAttribute('aria-label', t('ui.language'));
    $all('#langs button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    $('#btn-reset').textContent = t('ui.reset');
    TABS.forEach(function (k) { $('#tabbtn-' + k).textContent = t('tab.' + (k === 'payments' ? 'schedule' : k)); });
    $('#form-budget').innerHTML = budgetFormHTML();
    $('#others-rows').innerHTML = othersRowsHTML();
    $('#mode').innerHTML = modeHTML();
    $('#kpi-pay-l').textContent = t('r.payment');
    $('#kpi-ratio-l').textContent = t('r.ratio');
    $('#kpi-borrowed-l').textContent = t('r.borrowed');
    $('#pay-title').textContent = t('ch.title');
    $('#pay-sub').textContent = t('ch.sub');
    $('#pay-link').textContent = t('ch.toTable');
    $('#tab-payments').innerHTML = scheduleShellHTML();
    $('#tab-compare').innerHTML = compareShellHTML();
    $('#tab-rules').innerHTML = rulesHTML();
    syncInputs();
    update();
  }
  function update() {
    last = compute();
    renderHero(last);
    renderAid(last);
    renderDetails(last);
    renderDock(last);
    if (activeTab === 'budget') drawPay(last);
    if (activeTab === 'payments') renderSchedule(last);
    if (activeTab === 'compare') renderCompare(last);
  }
  function showTab(k, focus) {
    if (TABS.indexOf(k) < 0) k = 'budget';
    activeTab = k;
    TABS.forEach(function (x) {
      $('#tab-' + x).hidden = x !== k;
      var b = $('#tabbtn-' + x);
      b.setAttribute('aria-selected', x === k ? 'true' : 'false');
      b.tabIndex = x === k ? 0 : -1;
    });
    if (focus) $('#tabbtn-' + k).focus();
    try { if (location.hash !== '#' + k) history.replaceState(null, '', '#' + k); } catch (e) { /* ignore */ }
    update();
    dockCheck();
  }
  var heroSeen = true;
  function dockCheck() { $('#dock').classList.toggle('on', activeTab === 'budget' && !heroSeen); }

  function onInput(ev) {
    var el = ev.target, key, n;
    if (el.hasAttribute('data-num')) {
      key = el.getAttribute('data-num');
      n = parseNum(el.value, F[key].dec);
      el.parentNode.classList.toggle('bad', n === null);
      if (n === null) return;
      setValue(key, clamp(n, F[key].min, F[key].max));
    } else if (el.hasAttribute('data-other')) {
      var o = state.others[Number(el.getAttribute('data-other'))], prop = el.getAttribute('data-prop');
      if (!o) return;
      if (prop === 'name') o.name = el.value.slice(0, 40);
      else { n = parseNum(el.value, 2); if (n === null) return; o[prop] = n; state.others = state.others.map(cleanOther); }
      touched = true; save(); update();
    }
  }
  function onChange(ev) {
    var el = ev.target, key;
    if (el.hasAttribute('data-sel')) {
      key = el.getAttribute('data-sel');
      setValue(key, key === 'persons' ? Number(el.value) : el.value);
    } else if (el.hasAttribute('data-radio')) {
      key = el.getAttribute('data-radio');
      setValue(key, el.value === 'true' ? true : el.value === 'false' ? false : el.value);
    } else if (el.hasAttribute('data-check')) {
      setValue(el.getAttribute('data-check'), el.checked);
    }
  }
  function onBlur(ev) {
    var el = ev.target;
    if (el.hasAttribute && el.hasAttribute('data-num')) { el.parentNode.classList.remove('bad'); el.value = fmtInput(el.getAttribute('data-num')); }
    else if (el.hasAttribute && el.hasAttribute('data-other')) syncInputs();
  }
  function copyText(text, btn) {
    function done(ok) { btn.textContent = t(ok ? 'sc.copied' : 'sc.copyFail'); setTimeout(function () { btn.textContent = t('sc.copy'); }, 2200); }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta); done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback); else fallback();
  }
  var resetArmed = null;
  function onClick(ev) {
    var el = ev.target.closest('button, a');
    if (!el) return;
    var key;
    if (el.hasAttribute('data-hint')) {
      key = el.getAttribute('data-hint');
      if (allHints) { allHints = false; openHints = {}; $all('.hint').forEach(function (p) { openHints[p.id.slice(2)] = true; }); }
      openHints[key] = !openHints[key];
      syncInputs();
    } else if (el.hasAttribute('data-suggest')) {
      key = el.getAttribute('data-suggest');
      state.auto[key] = true; save(); syncInputs(); update();
    } else if (el.hasAttribute('data-lang')) {
      lang = el.getAttribute('data-lang'); save(); renderShell();
    } else if (el.hasAttribute('data-tab')) {
      showTab(el.getAttribute('data-tab'));
    } else if (el.id === 'btn-hints') {
      allHints = !allHints; if (!allHints) openHints = {}; syncInputs();
    } else if (el.id === 'btn-reset') {
      if (resetArmed) {
        clearTimeout(resetArmed); resetArmed = null;
        state = JSON.parse(JSON.stringify(DEFAULTS)); state.start = nextMonth(); touched = false; openYears = {};
        save(); renderShell();
      } else {
        el.textContent = t('ui.resetConfirm');
        resetArmed = setTimeout(function () { resetArmed = null; el.textContent = t('ui.reset'); }, 3500);
      }
    } else if (el.getAttribute('data-act') === 'add-loan') {
      if (state.others.length < 6) state.others.push({ name: t('others.default', { n: state.others.length + 1 }), amount: 10000, rate: 0, years: 10, deferral: 0 });
      touched = true; save(); $('#others-rows').innerHTML = othersRowsHTML(); syncInputs(); update();
    } else if (el.getAttribute('data-act') === 'remove-loan') {
      state.others.splice(Number(el.getAttribute('data-i')), 1);
      touched = true; save(); $('#others-rows').innerHTML = othersRowsHTML(); syncInputs(); update();
    } else if (el.getAttribute('data-act') === 'toggle-year') {
      var y = Number(el.getAttribute('data-y'));
      openYears[y] = !openYears[y];
      el.setAttribute('aria-expanded', openYears[y] ? 'true' : 'false');
      $all('tr.mo[data-y="' + y + '"]').forEach(function (tr) { tr.hidden = !openYears[y]; });
    } else if (el.getAttribute('data-act') === 'open-all') {
      var years = Math.ceil(last.plan.months / 12), all = true, i;
      for (i = 0; i < years; i++) if (!openYears[i]) all = false;
      for (i = 0; i < years; i++) openYears[i] = !all;
      renderSchedule(last);
    } else if (el.getAttribute('data-act') === 'csv') {
      var blob = new Blob(['﻿' + csvOf(last)], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = lang === 'fr' ? 'mensualites.csv' : 'payments.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } else if (el.getAttribute('data-act') === 'copy-csv') {
      copyText(csvOf(last), el);
    } else if (el.getAttribute('data-act') === 'to-top') {
      $('#hero').scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    } else if (el.id === 'pay-link') {
      showTab('payments', true); window.scrollTo(0, 0);
    }
  }

  function init() {
    state = load();
    lang = savedLang || ((navigator.language || 'fr').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    document.addEventListener('focusout', onBlur);
    document.addEventListener('click', onClick);
    document.addEventListener('submit', function (ev) { ev.preventDefault(); });
    $('#tabs').addEventListener('keydown', function (ev) {
      var i = TABS.indexOf(activeTab);
      if (ev.key === 'ArrowRight') { showTab(TABS[(i + 1) % TABS.length], true); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft') { showTab(TABS[(i + TABS.length - 1) % TABS.length], true); ev.preventDefault(); }
    });
    window.addEventListener('hashchange', function () { var k = location.hash.slice(1); if (k !== activeTab && TABS.indexOf(k) >= 0) showTab(k); });
    renderShell();
    showTab(TABS.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : 'budget');
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (en) { heroSeen = en[0].isIntersecting; dockCheck(); }, { threshold: 0.15 }).observe($('#hero'));
    }
    var raf = 0, lastW = window.innerWidth;
    window.addEventListener('resize', function () {
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(function () { stick(); if (activeTab === 'budget') drawPay(last); if (activeTab === 'compare') renderCompare(last); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
